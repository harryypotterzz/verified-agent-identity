name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Manual Link Script
        run: |
          cd scripts
          node manualLinkHumanToAgent.js --challenge '{"name": "harryypotterzz", "description": "harryypotterzz AI Agent"}'
